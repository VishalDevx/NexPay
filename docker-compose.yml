services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexpay
      POSTGRES_PASSWORD: nexpay
      POSTGRES_DB: nexpay
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexpay"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://nexpay:nexpay@postgres:5432/nexpay?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      JWT_SECRET: nexpay-dev-jwt-secret-min-16-chars!!
      ENCRYPTION_KEY: nexpay-dev-encryption-key-32chars!!
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        npx prisma db push --schema=apps/api/prisma/schema.prisma --accept-data-loss &&
        node apps/api/dist/index.js
      "

  merchant-portal:
    build:
      context: .
      dockerfile: apps/merchant-portal/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:3001
    depends_on:
      - api

  admin-portal:
    build:
      context: .
      dockerfile: apps/admin-portal/Dockerfile
    ports:
      - "3002:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:3001
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
