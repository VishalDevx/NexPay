services:
  - type: web
    name: nexpay-api
    env: docker
    dockerfilePath: apps/api/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nexpay-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: nexpay-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true

  - type: web
    name: nexpay-merchant-portal
    env: docker
    dockerfilePath: apps/merchant-portal/Dockerfile
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://nexpay-api.onrender.com

  - type: web
    name: nexpay-admin-portal
    env: docker
    dockerfilePath: apps/admin-portal/Dockerfile
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://nexpay-api.onrender.com

databases:
  - name: nexpay-db
    databaseName: nexpay
    plan: starter

redis:
  - name: nexpay-redis
    plan: starter
