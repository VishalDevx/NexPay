version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexpay
      POSTGRES_PASSWORD: nexpay
      POSTGRES_DB: nexpay
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexpay"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
      - "3004:3001"
    environment:
      DATABASE_URL: postgresql://nexpay:nexpay@postgres:5432/nexpay?schema=public
      REDIS_URL: redis://redis:6379
      PORT: "3001"
      NODE_ENV: development
      JWT_SECRET: e2e-test-jwt-secret-min-16-chars
      ENCRYPTION_KEY: e2e-test-encryption-key-32chars
      BYPASS_OTP: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        npx prisma db push --schema=apps/api/prisma/schema.prisma --accept-data-loss &&
        npx tsx apps/api/prisma/seed.ts &&
        node apps/api/dist/index.js
      "

  merchant-portal:
    build:
      context: .
      dockerfile: apps/merchant-portal/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:3001
    depends_on:
      - api
