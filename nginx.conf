events { worker_connections 1024; }

http {
  upstream api { server api:3001; }
  upstream merchant { server merchant-portal:3000; }
  upstream admin { server admin-portal:3002; }

  server {
    listen 80;
    server_name nexp ay.com api.nexpay.com;
    return 301 https://$server_name$request_uri;
  }

  server {
    listen 443 ssl;
    server_name api.nexpay.com;

    ssl_certificate /etc/letsencrypt/live/api.nexpay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nexpay.com/privkey.pem;

    location / {
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 30s;
    }
  }

  server {
    listen 443 ssl;
    server_name nexp ay.com;

    ssl_certificate /etc/letsencrypt/live/nexpay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexpay.com/privkey.pem;

    location / {
      proxy_pass http://merchant;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /admin {
      proxy_pass http://admin;
      proxy_set_header Host $host;
    }
  }
}
