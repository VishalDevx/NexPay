name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexpay
          POSTGRES_PASSWORD: nexpay
          POSTGRES_DB: nexpay
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Run lint
        run: npx turbo run lint

      - name: Run typecheck
        run: npx turbo run typecheck

  test:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexpay
          POSTGRES_PASSWORD: nexpay
          POSTGRES_DB: nexpay
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Run tests
        run: npx turbo run test
        env:
          DATABASE_URL: postgresql://nexpay:nexpay@localhost:5432/nexpay?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: nexpay-ci-jwt-secret-min-16-chars
          ENCRYPTION_KEY: nexpay-ci-encryption-key-32chars

  e2e:
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexpay
          POSTGRES_PASSWORD: nexpay
          POSTGRES_DB: nexpay
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Push schema and seed
        run: |
          npx prisma db push --schema=apps/api/prisma/schema.prisma --accept-data-loss
          npm run seed:demo
        env:
          DATABASE_URL: postgresql://nexpay:nexpay@localhost:5432/nexpay?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: nexpay-ci-jwt-secret-min-16-chars
          ENCRYPTION_KEY: nexpay-ci-encryption-key-32chars
          BYPASS_OTP: "true"

      - name: Build all apps
        run: npx turbo run build
        env:
          DATABASE_URL: postgresql://nexpay:nexpay@localhost:5432/nexpay?schema=public
          NEXT_PUBLIC_API_URL: http://localhost:3001

      - name: Start servers
        run: |
          node apps/api/dist/index.js &
          npx wait-on http://localhost:3001/api/v1/health --timeout 30000
          (cd apps/merchant-portal && npx next start -p 3000) &
          npx wait-on http://localhost:3000 --timeout 60000
        env:
          DATABASE_URL: postgresql://nexpay:nexpay@localhost:5432/nexpay?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: nexpay-ci-jwt-secret-min-16-chars
          ENCRYPTION_KEY: nexpay-ci-encryption-key-32chars
          BYPASS_OTP: "true"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_API_URL: http://localhost:3001

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: e2e-report/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Build all apps
        run: npx turbo run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
